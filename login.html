<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión — NOC CWP</title>
<style>
  :root{ --bg:#0b0f14; --panel:#12181f; --line:#22303c; --text:#e6edf3; --text-dim:#9fb0bd; --accent:#3b9eff; --danger:#ff4d6d; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .card{
    width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  h1{ font-size:18px; margin:0 0 4px; }
  p.sub{ margin:0 0 20px; color:var(--text-dim); font-size:13px; }
  label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; margin-top:14px; }
  input{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:#0e141a; color:var(--text); font-size:14px;
  }
  input:focus{ outline:none; border-color:var(--accent); }
  button{
    width:100%; margin-top:20px; padding:11px; border:none; border-radius:8px;
    background:var(--accent); color:#fff; font-weight:700; font-size:14px; cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:default; }
  .error{ color:var(--danger); font-size:12.5px; margin-top:12px; display:none; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>NOC CWP</h1>
    <p class="sub">Ingresa tus credenciales para continuar</p>
    <label for="username">Usuario</label>
    <input type="text" id="username" autocomplete="username" required />
    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <button type="submit" id="submitBtn">Ingresar</button>
    <div class="error" id="errorMsg">Usuario o contraseña incorrectos.</div>
  </form>

<script>
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Ingresando…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      if (!res.ok) throw new Error('invalid');
      window.location.href = '/';
    } catch (err) {
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
  });
</script>
</body>
</html>
